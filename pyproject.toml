[project]
name = "ecuador-mcp"
version = "0.8.6"
description = "Open public-data infrastructure for Ecuador, connecting official sources to AI assistants and software through MCP."
authors = [{ name = "Ecuador MCP Contributors" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "httpx>=0.28.0",
    "mcp>=1.25.0,<3",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.0",
    "pypdf>=6.16.2",
    "uvicorn>=0.30.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helpers*", "tools*", "prompts*", "resources*"]

[tool.setuptools.package-data]
helpers = ["data/*.json", "certs/*.pem"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "fpdf2>=2.8.8",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
