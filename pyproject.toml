[project]
name = "ecuador-mcp"
version = "0.6.0"
description = "Model Context Protocol (MCP) server for Ecuador open government data: CKAN, gob.ec, SERCOP OCDS, SGR risk events, and DPA geography."
authors = [{ name = "Ecuador MCP Contributors" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=1.25.0,<2",
    "openpyxl>=3.1.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helpers*", "tools*", "prompts*", "resources*"]

[tool.setuptools.package-data]
helpers = ["data/*.json"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
