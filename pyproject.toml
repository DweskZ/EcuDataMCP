[project]
name = "ecuador-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Ecuador's open government data. Search datasets, explore institutions, preview CSV data, and look up government procedures — all through AI conversation."
authors = [{ name = "Ecuador MCP Contributors" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "mcp>=1.25.0,<2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
