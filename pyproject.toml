[project]
name = "ecuador-mcp"
version = "0.8.10"
description = "Open public-data infrastructure for Ecuador, connecting official sources to AI assistants and software through MCP."
authors = [{ name = "EcuDataMCP contributors" }]
keywords = ["mcp", "model-context-protocol", "ecuador", "open-data", "datos-abiertos", "ckan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "httpx>=0.28.0",
    "mcp>=2.1.1,<3",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.0",
    "pypdf>=6.16.2",
    "pyxlsb>=1.0.10",
    "uvicorn>=0.30.0",
    "xlrd>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/DweskZ/EcuDataMCP"
Repository = "https://github.com/DweskZ/EcuDataMCP"
Changelog = "https://github.com/DweskZ/EcuDataMCP/blob/main/CHANGELOG.md"
Issues = "https://github.com/DweskZ/EcuDataMCP/issues"

[project.scripts]
ecuador-mcp = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["helpers*", "tools*", "prompts*", "resources*"]

[tool.setuptools.package-data]
helpers = ["data/*.json", "certs/*.pem"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-httpx>=0.35.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "fpdf2>=2.8.8",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
