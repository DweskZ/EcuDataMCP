services:
  mcp:
    build: .
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=${MCP_PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_REQUIRE_AUTH=${MCP_REQUIRE_AUTH:-1}
      - MCP_MAX_CONCURRENT_REQUESTS=${MCP_MAX_CONCURRENT_REQUESTS:-8}
      - MCP_RATE_LIMIT_REQUESTS=${MCP_RATE_LIMIT_REQUESTS:-120}
      - MCP_RATE_LIMIT_WINDOW_SECONDS=${MCP_RATE_LIMIT_WINDOW_SECONDS:-60}
      - MCP_SSL_CERTFILE=${MCP_SSL_CERTFILE:-}
      - MCP_SSL_KEYFILE=${MCP_SSL_KEYFILE:-}
      - BCE_CATALOG_SNAPSHOT_DIR=${BCE_CATALOG_SNAPSHOT_DIR:-/app/data/bce_catalog_snapshots}
      - IEM_CATALOG_DIR=${IEM_CATALOG_DIR:-/app/data/iem_catalog_snapshots}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MCP_PORT:-8000}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      # Persists data/supercias_financials.sqlite3 across container
      # recreates -- without this, every redeploy loses it and
      # search_ranking/get_financials go back to "run the build script"
      # until someone re-runs scripts/build_supercias_financials_db.py.
      - supercias_data:/app/data

volumes:
  supercias_data:
