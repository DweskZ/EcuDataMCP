name: Publish

# Runs when a GitHub release is published. Uploads the package to PyPI via
# trusted publishing (OIDC, no stored token) and then registers server.json
# in the official MCP Registry, which verifies the PyPI package through the
# `mcp-name:` comment in README.md. The MCPB bundle is attached to the
# release as well.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # The tag, pyproject.toml and server.json must agree, otherwise PyPI
      # and the MCP Registry end up advertising different versions.
      - name: Check version consistency
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
          jq -e --arg v "$version" '.version == $v and .packages[0].version == $v' server.json
          jq -e --arg v "$version" '.version == $v' manifest.json
          # The MCP Registry rejects descriptions over 100 characters.
          jq -e '.description | length <= 100' server.json
          if [ "${{ github.event_name }}" = "release" ]; then
            test "${{ github.event.release.tag_name }}" = "v$version"
          fi

      - name: Run tests
        run: uv run pytest -q

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ecuador-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # A manual rerun after the registry step fails would otherwise stop
      # here, because PyPI refuses to re-upload an existing version.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # The MCPB bundle (manifest.json + .mcpbignore) is what Smithery and
  # Claude Desktop install for a local stdio server; it is attached to the
  # GitHub release rather than uploaded anywhere.
  mcpb:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Pack bundle
        run: |
          npx -y @anthropic-ai/mcpb validate manifest.json
          npx -y @anthropic-ai/mcpb pack . "ecuador-mcp-${GITHUB_REF_NAME#v}.mcpb"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ecuador-mcp-*.mcpb --clobber

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
