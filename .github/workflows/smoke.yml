name: Smoke test

# Unlike ci.yml (mocked HTTP, runs on every push/PR), this hits the real
# government sites this project scrapes. It's slow and depends on external
# uptime, so it runs on its own schedule instead of blocking every push --
# a failure here means a live source broke (HTML/API changed, moved,
# went down), not that a code change is bad. GitHub emails the repo's
# watchers by default when a scheduled workflow run fails, so this needs
# no extra alerting setup.

on:
  schedule:
    - cron: "17 9 * * *" # once a day; avoids the top-of-hour cron stampede
  workflow_dispatch: {}

# The job only reads the checkout; the default token would also be able to
# write to the repository.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev --locked
      # Runners sit outside LatAm, so datosabiertos.gob.ec and similar hosts
      # answer 403. With a LatAm SSH egress (docs/GEOBLOCK_PLAN.md, 2a) we open
      # a SOCKS tunnel; without the secrets (forks, not yet provisioned) the
      # step is skipped and those checks stay degraded. The tunnel carries
      # every geo-fenced request, so the host key is always pinned
      # (GEO_SSH_KNOWN_HOSTS, a `ssh-keyscan` line): never accept-new, which
      # would trust whatever key answers first.
      - name: Open geo tunnel
        env:
          GEO_SSH_KEY: ${{ secrets.GEO_SSH_KEY }}
          GEO_SSH_HOST: ${{ secrets.GEO_SSH_HOST }}
          GEO_SSH_KNOWN_HOSTS: ${{ secrets.GEO_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$GEO_SSH_KEY" ] || [ -z "$GEO_SSH_HOST" ]; then
            echo "GEO_SSH_KEY/GEO_SSH_HOST not set; skipping geo tunnel."
            exit 0
          fi
          if [ -z "$GEO_SSH_KNOWN_HOSTS" ]; then
            echo "::error::GEO_SSH_KNOWN_HOSTS is not set. Add the tunnel host's known_hosts line (ssh-keyscan <host>) as a repository secret; the tunnel is never opened against an unverified host key."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GEO_SSH_KEY" > ~/.ssh/geo_key
          chmod 600 ~/.ssh/geo_key
          printf '%s\n' "$GEO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -f -N -D 127.0.0.1:1080 -i ~/.ssh/geo_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            "$GEO_SSH_HOST"
          echo "ECUADOR_MCP_GEO_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
      - name: Start server
        run: |
          uv run main.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "server did not become healthy in time"
          cat server.log
          exit 1
      - name: Smoke test
        run: uv run python scripts/smoke_e2e.py
      - name: Server log (on failure)
        if: failure()
        run: |
          if [ -f server.log ]; then
            cat server.log
          else
            echo "server.log was not created; the failure happened before startup."
          fi
