name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the checkout; the default token would also be able to
# write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject.toml's requires-python (>=3.11); also covers the
        # 3.14 the Dockerfile actually ships.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group dev --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  # Builds the static site (web/) and checks search index, links and counts.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install
        run: uv sync --locked
      - name: Extract tool signatures
        run: uv run python scripts/extract_tool_signatures.py
      - name: Build
        run: uv run python build.py
      - name: Test
        run: uv run --with pytest pytest tests -q

  # Runs the image the way MCP clients and Glama's checks do (`docker run -i`,
  # JSON-RPC over stdio) and fails unless it answers tools/list.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ecuador-mcp .
      - name: stdio handshake
        run: |
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 15
          } | timeout 60 docker run -i --rm ecuador-mcp > out.jsonl || true
          count=$(jq -s '[.[] | select(.id == 2)][0].result.tools | length' out.jsonl)
          echo "tools: $count"
          test "$count" -ge 80
