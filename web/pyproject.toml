[project]
name = "ecudatamcp-web"
version = "0.1.0"
description = "Static site generator for the EcuDataMCP landing page."
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "markupsafe>=2.1"]

[tool.uv]
package = false

# Without this, pytest walks up to the repo root's settings, whose asyncio
# options need pytest-asyncio, which this environment does not install.
[tool.pytest.ini_options]
testpaths = ["tests"]
